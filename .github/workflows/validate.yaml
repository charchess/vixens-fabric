name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify required governance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f WORKFLOW.md
          test -f contracts/README.md
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

  release-channel-invariants:
    name: Release channel invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release workflow invariants
        run: python3 scripts/test-release-channel.py
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint .github/workflows/*.yaml

  validation-summary:
    name: Validation Summary
    if: always()
    needs: [repository-hygiene, release-channel-invariants]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on a non-success prerequisite
        env:
          HYGIENE: ${{ needs.repository-hygiene.result }}
          RELEASE_CHANNEL: ${{ needs.release-channel-invariants.result }}
        run: |
          test "$HYGIENE" = success
          test "$RELEASE_CHANNEL" = success
