name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Verify required governance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f WORKFLOW.md
          test -f contracts/README.md
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

  release-channel-invariants:
    name: Release channel invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release workflow invariants
        run: python3 scripts/test-release-channel.py
      - name: Verify and install actionlint v1.7.7 (Linux amd64)
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}" -o "${ACTIONLINT_ARCHIVE}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${ACTIONLINT_ARCHIVE}" | sha256sum -c -
          tar -xzf "${ACTIONLINT_ARCHIVE}" actionlint
          chmod +x actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint .github/workflows/*.yaml

  openbao-fabric-contract:
    name: OpenBao Fabric contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: Verify and install Kustomize v5.4.3 (Linux amd64)
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=5.4.3
          KUSTOMIZE_ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          KUSTOMIZE_SHA256=3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
          curl --fail --silent --show-error --location \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/${KUSTOMIZE_ARCHIVE}" \
            -o "${KUSTOMIZE_ARCHIVE}"
          printf '%s  %s\n' "${KUSTOMIZE_SHA256}" "${KUSTOMIZE_ARCHIVE}" | sha256sum -c -
          tar -xzf "${KUSTOMIZE_ARCHIVE}" kustomize
          install -m 0755 kustomize "${RUNNER_TEMP}/kustomize"
          printf '%s\n' "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Verify and install kubectl v1.30.4 (Linux amd64)
        run: |
          set -euo pipefail
          KUBECTL_VERSION=1.30.4
          KUBECTL_SHA256=2ffd023712bbc1a9390dbd8c0c15201c165a69d394787ef03eda3eccb4b9ac06
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            -o kubectl
          printf '%s  %s\n' "${KUBECTL_SHA256}" kubectl | sha256sum -c -
          install -m 0755 kubectl "${RUNNER_TEMP}/kubectl"
          printf '%s\n' "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Render OpenBao Fabric overlay
        run: |
          set -euo pipefail
          kustomize build apps/60-services/txo-fabric/openbao-fabric/overlays/prod > openbao-fabric-rendered.yaml
          test -s openbao-fabric-rendered.yaml
      - name: Bind OpenBao diff baseline to the immutable PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          printf 'BASE_SHA=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Run immutable OpenBao storage audit contract
        run: node --test apps/60-services/txo-fabric/openbao-fabric/overlays/prod/storage/audit-storage.test.mjs
      - name: Run bootstrap reachability contract
        run: node --test tests/test_openbao_bootstrap_reachability_contract.mjs

  browser-authority-contract:
    name: Browser authority contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: Verify and install Kustomize v5.4.3 (Linux amd64)
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=5.4.3
          KUSTOMIZE_ARCHIVE="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          KUSTOMIZE_SHA256=3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
          curl --fail --silent --show-error --location             "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/${KUSTOMIZE_ARCHIVE}"             -o "${KUSTOMIZE_ARCHIVE}"
          printf '%s  %s\n' "${KUSTOMIZE_SHA256}" "${KUSTOMIZE_ARCHIVE}" | sha256sum -c -
          tar -xzf "${KUSTOMIZE_ARCHIVE}" kustomize
          install -m 0755 kustomize "${RUNNER_TEMP}/kustomize"
          printf '%s\n' "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Run browser authority core contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/browser-authority-contract.test.mjs
      - name: Run browser authority migration boundary contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/browser-authority-migration-boundary.test.mjs
      - name: Run authority collaborators contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/authority-collaborators.test.mjs
      - name: Run authority collaborators negative contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/authority-collaborators-negative.test.mjs
      - name: Run authority ledger capability negative contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/authority-ledger-capability-negative.test.mjs
      - name: Run authority source adapters contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/authority-source-adapters.test.mjs
      - name: Run authority source adapters negative contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/authority-source-adapters-negative.test.mjs
      - name: Run browser authority store contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/browser-authority-store.test.mjs
      - name: Run browser authority store negative contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/browser-authority-store-negative.test.mjs
      - name: Run browser authority store numeric negative contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/browser-authority-store-numeric-negative.test.mjs
      - name: Run Browser Authority 004 activation intent contract
        run: node --test apps/60-services/txo-fabric/webui/browser-authority-004-intent/browser-authority-004-intent.test.mjs
      - name: Run BFF runtime credentials durability contract
        run: node --test apps/60-services/txo-fabric/webui/test/bff-runtime-credentials-durability.test.mjs

  openfga-runtime-hook-contract:
    name: OpenFGA runtime hook contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: Run OpenFGA runtime hook contract
        run: node --test apps/60-services/txo-fabric/openfga/runtime/openfga-runtime-hook.test.mjs

  client0-bootstrap-contract:
    name: Client0 bootstrap contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: Run Client0 operator eligibility contract
        working-directory: apps/60-services/txo-fabric/operator
        run: go test ./internal/controller -run '^TestEvaluateClient0BootstrapEligibility$'
      - name: Run Client0 bootstrap ledger contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/client0-bootstrap-ledger.test.mjs
      - name: Run Client0 ledger negative contract
        run: node --test apps/60-services/txo-fabric/webui/server/authority/client0-ledger-negative.test.mjs
      - name: Run Client0 canonical read-set eligibility contract
        working-directory: apps/60-services/txo-fabric/operator
        run: go test ./internal/controller -run '^TestClient0EligibilityFromCanonicalReadSetRejectsAuthorityGaps$'
      - name: Run Client0 eligibility adapter boundary contract
        run: node --test apps/60-services/txo-fabric/operator/internal/controller/client0_eligibility_adapter_boundary.test.mjs

  validation-summary:
    name: Validation Summary
    if: always()
    needs: [repository-hygiene, release-channel-invariants, openbao-fabric-contract, browser-authority-contract, openfga-runtime-hook-contract, client0-bootstrap-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on a non-success prerequisite
        env:
          HYGIENE: ${{ needs.repository-hygiene.result }}
          RELEASE_CHANNEL: ${{ needs.release-channel-invariants.result }}
          OPENBAO_FABRIC_CONTRACT: ${{ needs.openbao-fabric-contract.result }}
          BROWSER_AUTHORITY_CONTRACT: ${{ needs.browser-authority-contract.result }}
          OPENFGA_RUNTIME_HOOK_CONTRACT: ${{ needs.openfga-runtime-hook-contract.result }}
          CLIENT0_BOOTSTRAP_CONTRACT: ${{ needs.client0-bootstrap-contract.result }}
        run: |
          test "$HYGIENE" = success
          test "$RELEASE_CHANNEL" = success
          test "$OPENBAO_FABRIC_CONTRACT" = success
          test "$BROWSER_AUTHORITY_CONTRACT" = success
          test "$OPENFGA_RUNTIME_HOOK_CONTRACT" = success
          test "$CLIENT0_BOOTSTRAP_CONTRACT" = success
