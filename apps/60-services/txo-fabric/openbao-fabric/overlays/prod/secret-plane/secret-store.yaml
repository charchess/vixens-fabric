---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-fabric-store
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/component: secret-plane-client
    app.kubernetes.io/part-of: txo-fabric
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    vault:
      server: https://openbao-fabric.txo-fabric-system.svc:8200
      path: fabric
      version: v2
      caProvider:
        type: Secret
        name: openbao-fabric-ca
        key: tls.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: txo-fabric-eso-webui-bff
          serviceAccountRef:
            name: txo-fabric-eso
