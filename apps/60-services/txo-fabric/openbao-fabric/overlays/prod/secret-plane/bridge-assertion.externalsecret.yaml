---
# Exact one-record bridge assertion projection; values are never source-controlled.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-fabric-private-bridge-assertion
  namespace: txo-fabric-system
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-fabric-store
    kind: SecretStore
  target:
    name: txo-fabric-private-bridge-assertion
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: hmac-key
      remoteRef:
        key: platform/txo-fabric/webui-bff/bridge-assertion
        property: hmac-key
