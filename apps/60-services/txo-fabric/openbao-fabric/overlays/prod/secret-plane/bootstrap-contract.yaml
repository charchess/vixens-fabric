---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-fabric-eso-bootstrap-contract
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/component: secret-plane-bootstrap
    app.kubernetes.io/part-of: txo-fabric
data:
  policy.hcl: |
    # v1: one record, read only. No metadata/list/token/policy/mount/system access.
    path "fabric/data/platform/txo-fabric/webui-bff" {
      capabilities = ["read"]
    }
  configure.sh: |
    #!/usr/bin/env sh
    set -eu
    export BAO_ADDR="https://openbao-fabric.txo-fabric-system.svc:8200"
    export BAO_CACERT="/var/run/openbao-ca/tls.crt"
    export BAO_TOKEN="$(cat /var/run/openbao-bootstrap/token)"
    reviewer="$(cat /var/run/secrets/tokens/reviewer)"
    api_host="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
    bao status >/dev/null
    bao secrets enable -path=fabric kv-v2 2>/dev/null || bao secrets list -format=json | grep -q '"fabric/"'
    bao auth enable -path=kubernetes kubernetes 2>/dev/null || bao auth list -format=json | grep -q '"kubernetes/"'
    bao write auth/kubernetes/config       kubernetes_host="$api_host"       kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt       token_reviewer_jwt="$reviewer"       issuer="https://kubernetes.default.svc"
    bao policy write txo-fabric-eso-webui-bff-v1 /contract/policy.hcl
    bao write auth/kubernetes/role/txo-fabric-eso-webui-bff       bound_service_account_names="txo-fabric-eso"       bound_service_account_namespaces="txo-fabric-system"       audience="openbao-fabric-eso"       token_policies="txo-fabric-eso-webui-bff-v1"       token_ttl="15m"       token_max_ttl="30m"
