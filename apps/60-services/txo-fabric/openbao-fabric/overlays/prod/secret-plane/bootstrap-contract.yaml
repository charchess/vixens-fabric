---
# Non-executable contract marker. Bootstrap material is held outside Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-fabric-eso-bootstrap-contract
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/component: secret-plane-bootstrap
    app.kubernetes.io/part-of: txo-fabric
  annotations:
    vixens.io/bootstrap-authority: out-of-git-platform-custody
    vixens.io/eso-store: openbao-fabric-store
    vixens.io/eso-service-account: txo-fabric-eso
    vixens.io/openbao-auth-mount: kubernetes
    vixens.io/openbao-role: txo-fabric-eso-webui-bff
    vixens.io/openbao-policy: txo-fabric-eso-webui-bff-v1
    vixens.io/openbao-record: fabric/platform/txo-fabric/webui-bff
immutable: true
