---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-fabric-cerbera-test-egress
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/component: secret-plane-bootstrap
    app.kubernetes.io/part-of: txo-fabric
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-fabric
      app.kubernetes.io/component: secret-plane-bootstrap
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.111.69/32
      ports:
        - port: 443
          protocol: TCP
