---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - secret-plane
  - storage/retained-pvc.yaml
  - storage/audit-pvc.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: openbao-fabric
    path: storage/retained-statefulset-volume.yaml
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: openbao-fabric
    path: storage/audit-statefulset-volume.yaml
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: openbao-fabric
    path: storage/kubernetes-reviewer-statefulset.yaml
  - target:
      version: v1
      kind: ConfigMap
      name: openbao-fabric-config
      namespace: txo-fabric-system
    path: storage/openbao-config-wave.yaml
