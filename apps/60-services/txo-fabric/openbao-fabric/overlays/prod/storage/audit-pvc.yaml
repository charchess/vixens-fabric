---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-fabric-audit
  namespace: txo-fabric-system
  annotations:
    # Audit retention is independent from Raft data and is never an Argo prune target.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "-4"
  labels:
    app.kubernetes.io/component: secret-plane-audit
    app.kubernetes.io/name: openbao-fabric
    app.kubernetes.io/part-of: txo-fabric
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-rwo-retain
  resources:
    requests:
      storage: 5Gi
