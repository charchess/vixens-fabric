apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao-fabric-v2
  namespace: txo-fabric-system
  labels:
    app.kubernetes.io/name: openbao-fabric-v2
    app.kubernetes.io/component: secret-plane-v2
    app.kubernetes.io/part-of: txo-fabric
spec:
  serviceName: openbao-fabric-v2
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-fabric-v2
      app.kubernetes.io/component: secret-plane-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-fabric-v2
        app.kubernetes.io/component: secret-plane-v2
        app.kubernetes.io/part-of: txo-fabric
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.6.2
          ports:
            - name: api
              containerPort: 8200
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: raft
              mountPath: /openbao/raft
            - name: audit
              mountPath: /openbao/audit
            - name: tls
              mountPath: /openbao/tls
              readOnly: true
      volumes:
        - name: raft
          persistentVolumeClaim:
            claimName: openbao-fabric-v2-raft
        - name: audit
          persistentVolumeClaim:
            claimName: openbao-fabric-v2-audit
        - name: tls
          secret:
            secretName: openbao-fabric-v2-tls
