apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: txo-fabric-webui-bff-runtime-credentials-dedicated
  namespace: txo-fabric-system
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-fabric-webui-bff-runtime-store
    kind: SecretStore
  target:
    name: txo-fabric-webui-bff-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/webui-bff
        property: runtime_username
    - secretKey: password
      remoteRef:
        key: vixens/prod/apps/60-services/txo-fabric/webui-bff
        property: runtime_password
