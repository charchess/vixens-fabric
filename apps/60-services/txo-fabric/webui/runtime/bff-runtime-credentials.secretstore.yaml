apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-fabric-webui-bff-runtime-store
  namespace: txo-fabric-system
spec:
  provider:
    vault:
      server: https://openbao-fabric.txo-fabric-system.svc:8200
      path: fabric
      version: v2
      auth:
        tokenSecretRef:
          name: txo-fabric-webui-bff-runtime-eso-token
          key: token
