---
# Active production slice: private BFF runtime plus the CNPG role/database
# declarations. Credential projection and migration execution remain out of this
# Kustomization and retain their separate review/activation boundary.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runtime
  - bootstrap/database.yaml
configMapGenerator:
  - name: txo-fabric-webui-sql-migrations
    namespace: txo-fabric-system
    files:
      - 001_oidc_login_transactions.sql=db/migrations/001_oidc_login_transactions.sql
      - 002_global_browser_sessions.sql=db/migrations/002_global_browser_sessions.sql
      - 003_oidc_global_session_binding.sql=db/migrations/003_oidc_global_session_binding.sql
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: txo-fabric-webui-bff
    app.kubernetes.io/part-of: txo-fabric
